<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class="title">Выбери свой продукт</h1>

        <ul class="product_list">
            <li class="product_card_box">
                <img src="mousse.jpg" alt="Увлажняющий мусс">
                <p class="category">для нормальной кожи</p>
                <h2 class="product-name">Увлажняющий мусс</h2>
                <p class="main-text description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.</p>

                <span class="main-text compound">Состав: </span>

                <ul>
                    <li class="ingredients">активные натуральные комплексы</li>
                    <li class="ingredients">витамины С, А, РР, В И Е</li>
                    <li class="ingredients">солнцезащитные компоненты</li>
                </ul>

                <span class="price">Цена:</span>
                <span class="price_sum">2 750 ₽</span>
            </li>
        </ul>
    </body>
    </html>
